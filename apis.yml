name: Oasis Security
description: >-
  Oasis Security is an enterprise Non-Human Identity Management (NHIM) and
  agentic access management platform that discovers, governs, and secures
  non-human identities — service accounts, API keys, secrets, certificates, and
  AI agents — across cloud and on-premises environments. The platform focuses on
  understanding access intent rather than static roles, enabling enterprises to
  adopt AI and automation securely at scale. Oasis targets enterprise security
  teams through a sales-led (demo-request) motion rather than a self-service
  developer product, and does not publish a public API, OpenAPI specification, or
  developer portal; its product documentation is a login-gated knowledge base.
